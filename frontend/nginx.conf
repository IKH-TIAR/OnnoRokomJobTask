server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Runtime config (backend URL): never cache, so a changed API_BASE_URL applies on reload.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Built assets have content hashes in their names, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (e.g. /my-applications after a refresh) serve index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
