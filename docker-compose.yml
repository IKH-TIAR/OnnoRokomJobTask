services:
  postgres:
    image: postgres:17-alpine
    # Headroom for several API processes (each pools up to 40 connections) during admission rush
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
