# Start everything:          docker compose up --build
#   Frontend: http://localhost:3000    Backend API: http://localhost:8080
# Run the backend tests:     docker compose run --rm backend-tests
# Bonus (2nd backend :8081): docker compose --profile multi up --build

x-backend-env: &backend-env
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=school_admission;Username=postgres;Password=postgres;Maximum Pool Size=40;GSS Encryption Mode=Disable"
  HOLD_DURATION_SECONDS: "${HOLD_DURATION_SECONDS:-600}"
  Cors__AllowedOrigins: "${CORS_ALLOWED_ORIGINS:-*}"

services:
  postgres:
    image: postgres:17-alpine
    # Headroom for several API processes (each pools up to 40 connections) during admission rush
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Published on 5433 so it doesn't clash with a locally installed PostgreSQL.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: final
    environment:
      <<: *backend-env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      # Used by the browser, so it must be reachable from the user's machine.
      API_BASE_URL: "${API_BASE_URL:-http://localhost:8080}"
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Bonus: a second backend process on another port sharing the same database.
  backend-2:
    profiles: ["multi"]
    build:
      context: ./backend
      target: final
    environment:
      <<: *backend-env
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DB_CONNECTION: "Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
